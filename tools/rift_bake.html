<!doctype html><html><body style="margin:0;background:#000">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
// tools/rift_bake.py 가 띄운다. 협곡 지형(scene.json/bin) 을 롤 카메라 또는 위에서 본 시점으로 그린다
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const W = +q.get('w'), H = +q.get('h');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
const root = new THREE.Group(); root.scale.set(-1, 1, 1); scene.add(root);
const meta = await (await fetch('scene.json')).json();
const bin = await (await fetch('scene.bin')).arrayBuffer();
const loader = new THREE.TextureLoader();
const texCache = {};
const loads = [];
for (const e of meta) {
  if (!e.file) continue;
  if (e.shader.some(s => /Indicator|DynamicEffect/.test(s))) continue;   // 깜빡이는 효과·흔들리는 풀은 뺀다
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(bin, e.pos, e.n * 3), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(bin, e.uv, e.n * 2), 2));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(bin, e.idx, e.ni), 1));
  let t = texCache[e.file];
  if (!t) {
    t = texCache[e.file] = loader.load(e.file);
    loads.push(new Promise(r => { const iv = setInterval(() => { if (t.image && t.image.complete) { clearInterval(iv); r(); } }, 50); }));
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.flipY = false; t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = 16;
  }
  const alpha = e.shader.some(s => /AlphaTest/.test(s));
  const m = new THREE.MeshBasicMaterial({ map: t, side: THREE.DoubleSide, alphaTest: alpha ? 0.3 : 0, transparent: false });
  if (/VertexDeform/.test(e.name)) { m.color.setRGB(0.36, 0.56, 0.44); m.alphaTest = 0.4; }   // 풀숲: 롤은 셰이더에서 초록으로 물들인다
  root.add(new THREE.Mesh(g, m));
}
await Promise.all(loads);
const mode = q.get('mode');
let cam;
if (mode === 'top') {
  const cx = +q.get('cx'), cz = +q.get('cz'), half = +q.get('half');
  cam = new THREE.OrthographicCamera(-half, half, half * H / W, -half * H / W, 1, 20000);
  cam.position.set(-cx, 8000, cz); cam.up.set(0, 0, 1); cam.lookAt(-cx, 0, cz);
} else {
  const cx = +q.get('cx'), cz = +q.get('cz'), gh = +q.get('gh'), D = +q.get('d'), F = +q.get('f');
  const P = 56 * Math.PI / 180;
  cam = new THREE.PerspectiveCamera(2 * Math.atan(H / 2 / F) * 180 / Math.PI, W / H, 50, 30000);
  cam.position.set(-cx, gh + D * Math.sin(P), cz - D * Math.cos(P));
  cam.lookAt(-cx, gh, cz);
}
renderer.render(scene, cam);
// 높이 재기: 아래로 쏜 선이 처음 닿는 곳
window.heightAt = (x, z) => {
  const rc = new THREE.Raycaster(new THREE.Vector3(-x, 5000, z), new THREE.Vector3(0, -1, 0));
  const h = rc.intersectObjects(root.children, false)[0];
  return h ? h.point.y : null;
};
window.done = true;
</script></body></html>
