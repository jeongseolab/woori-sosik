# Render 에 올릴 때 쓰는 설정 파일.
# 이 파일이 저장소에 있으면 Render 가 알아서 읽는다.
services:
  - type: web
    # 이 이름이 주소가 된다(tier-gg.onrender.com). 만든 뒤에는 주소를 바꿀 수 없다
    name: tier-gg
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # $PORT 는 Render 가 정해서 알려주는 번호다. 고정하면 안 된다
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # 계정과 방을 저장할 바깥 데이터베이스 주소(Neon 등).
      # 무료 플랜은 디스크를 못 쓰고, 서버가 잠들었다 깨면 폴더가 초기화된다.
      # 그래서 서버 밖에 둔다. 이 값이 비어 있으면 그냥 mytier.db 파일을 쓴다
      - key: DATABASE_URL
        sync: false
