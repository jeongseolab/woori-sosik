# Render 무료 서버 깨우기.
# 무료 서버는 15분 동안 아무도 안 오면 잠들고, 다음 사람이 30초 넘게 기다린다.
# 10분마다 가벼운 주소(/api/health) 를 한 번 불러서 잠들지 않게 한다.
#
# - /api/health 는 DB 도 OP.GG 도 건드리지 않는다(Neon 무료 사용 시간을 아낀다)
# - GitHub 이 예약 시각을 몇 분씩 늦출 때가 있다. 그래서 15분이 아니라 10분마다
# - 저장소에 60일 동안 변경이 없으면 GitHub 이 예약 실행을 멈춘다. 그땐 Actions 탭에서 다시 켠다
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:        # Actions 탭에서 손으로도 돌려 볼 수 있게

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Tier.gg 깨우기
        run: |
          # 잠들어 있었다면 깨는 데 30~60초 걸린다. 그래서 넉넉히 기다리고 두 번까지 다시 시도
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            https://tier-gg.onrender.com/api/health
