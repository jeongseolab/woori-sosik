# Tier.gg 앱(Windows·macOS) 만들어 릴리스에 올리기.
#
# app-v1.0.0 같은 태그를 올리면 두 OS 에서 app/build.py 를 돌리고, 그 태그 이름으로 릴리스를 만들어 파일을 붙인다.
#   git tag app-v1.0.0 && git push origin app-v1.0.0
# 웹의 "아이템 추천" 화면 다운로드 버튼은 가장 최근의 app-v* 릴리스를 가리킨다(main.py 의 /api/app/latest).
# Actions 탭에서 손으로 돌리면(태그 없이) 만들기만 하고 결과는 그 실행의 Artifacts 에 남는다.
name: app

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8     # Windows 서버 기본 출력(cp1252) 은 한글을 못 찍는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 도구 설치
        run: pip install pyinstaller==6.11.1 pillow==11.0.0 httpx==0.28.1 pywebview==5.3.2
      - name: 앱 만들기
        run: python app/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            dist/Tier.gg.exe
            dist/Tier.gg.zip
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/app-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tier.gg 앱 ${GITHUB_REF_NAME#app-v}" \
            --notes "Tier.gg 앱 ${GITHUB_REF_NAME#app-v}. 챔프 선택에서 빌드를 상점 추천 탭에 넣고, 게임 중에는 이번에 살 아이템을 알려 줘요."
